<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f2070"/>
      <stop offset=".55" stop-color="#160f36"/>
      <stop offset="1" stop-color="#07050f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b9adff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#8b7bff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8b7bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d2ff"/>
    </linearGradient>
  </defs>
  <!-- fond -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="34" r="22" fill="url(#glow)" opacity=".35"/>
  <!-- téléphone -->
  <rect x="17.5" y="7.5" width="29" height="49" rx="7.5" fill="#05040c" stroke="#efeaff" stroke-width="3"/>
  <rect x="27" y="12" width="10" height="3.2" rx="1.6" fill="#efeaff" opacity=".9"/>
  <!-- lune à demi éclipsée : hors ligne -->
  <circle cx="32" cy="33" r="12" fill="url(#glow)"/>
  <circle cx="32" cy="33" r="8" fill="url(#moon)"/>
  <path d="M32 25 A8 8 0 0 0 32 41 Z" fill="#05040c"/>
  <circle cx="32" cy="33" r="8" fill="none" stroke="#8b7bff" stroke-width="1.3"/>
  <rect x="26" y="49" width="12" height="2.2" rx="1.1" fill="#efeaff" opacity=".6"/>
  <!-- notification sans réponse -->
  <circle cx="46.5" cy="10" r="6" fill="#ff453a" stroke="#160f36" stroke-width="2.5"/>
</svg>
