<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Hors Ligne — un jeu d'enquête dans le téléphone de Nora, disparue depuis quatre jours.">
<title>Hors Ligne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@500;700&family=Playfair+Display:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <aside id="side">
    <div class="side-title">HORS<span>·</span>LIGNE</div>
    <p class="side-sub">Le téléphone de Nora Valette</p>
    <div class="side-block">
      <div class="side-label">Enquête</div>
      <div class="side-progress"><div id="sideBar"></div></div>
      <div id="sideCount" class="side-small">0 indice</div>
    </div>
    <div class="side-block side-help">
      <div class="side-label">Commandes</div>
      <p>Clique sur la <b>barre du bas</b> de l'écran (ou <kbd>Échap</kbd>) pour revenir à l'accueil.</p>
      <p>Bloqué·e ? <b>Appelle Jade</b>, ou ouvre ton <b>Carnet</b>.</p>
    </div>
    <div class="side-actions">
      <button id="sideMute" class="side-btn">🔊 Son activé</button>
    </div>
    <p class="side-small side-foot">🎧 Jeu sonore. Mets un casque.</p>
  </aside>

  <div id="phoneWrap">
    <div id="phone">
      <div id="screen" class="dark-status">
        <div id="wall"></div>
        <div id="lock"></div>
        <div id="home"></div>
        <div id="appwin"></div>
        <div id="call"></div>
        <div id="overlay"></div>
        <div id="banners"></div>
        <div id="statusbar">
          <div class="sb-left"><span id="sbTime">9:41</span></div>
          <div class="sb-right">
            <svg class="sb-signal" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/></svg>
            <svg class="sb-wifi" viewBox="0 0 16 12"><path d="M8 11.5l2.2-2.6a3.3 3.3 0 0 0-4.4 0z"/><path d="M3.6 6.9l1.4 1.6a4.6 4.6 0 0 1 6 0l1.4-1.6a6.7 6.7 0 0 0-8.8 0z"/><path d="M1 4.2l1.4 1.6a8.5 8.5 0 0 1 11.2 0L15 4.2a10.6 10.6 0 0 0-14 0z"/></svg>
            <div class="sb-batt"><div class="sb-batt-in"><div id="sbBattFill"></div></div><span id="sbBatt">23</span></div>
          </div>
        </div>
        <div id="island"><div class="isl-content"></div></div>
        <div id="cluetoast"></div>
        <div id="homebar" title="Accueil"><div></div></div>
      </div>
    </div>
  </div>
</div>

<div id="intro"></div>
<div id="ending"></div>

<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/story.js"></script>
<script src="js/os.js"></script>
<script src="js/apps.js"></script>
<script src="js/main.js"></script>
</body>
</html>
